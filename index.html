<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="./styles.css">
    <title>Hello from Electron renderer!</title>
  </head>
  <body>
    <h1>Hello from Electron renderer!</h1>
    <p>👋</p>

    <p>
      <button type="button">Click Me!</button>
    </p>
    
    <p>
      <input type="checkbox" aria-label="check1" name="check1" value="Check1">
      <label for="check1">Check This Box!</label>
    </p>

    <p>
      <label for="text1">Text Entry:</label>
      <input type="text" area-label="text1" name="text1" placeholder="">
    </p>

    <p>
      <button class="green-button">Click Me, I'm Green!</button>
    </p>
  </body>
</html>
