name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ${{ github.event.repository.name }}
            asset_name: ${{ github.event.repository.name }}-ubuntu
          - os: windows-latest
            artifact_name: ${{ github.event.repository.name }}
            asset_name: ${{ github.event.repository.name }}-windows
          - os: macos-latest
            artifact_name: ${{ github.event.repository.name }}
            asset_name: ${{ github.event.repository.name }}-macos
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Ubuntu specific steps
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        echo "Running Ubuntu specific commands..."
        sudo chown root ./node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 ./node_modules/electron/dist/chrome-sandbox
        xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test
        echo "Finished running commands."
    - name: Run Playwright tests
      if: ${{ matrix.os != 'ubuntu-latest' }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.os }}
        path: ./output/
        retention-days: 30
